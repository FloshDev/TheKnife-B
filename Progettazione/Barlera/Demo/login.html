<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TheKnife — Accedi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FEF3E2;
      --berry:     #FAB12F;
      --plum:      #FA812F;
      --charcoal:  #2C2C2C;
      --white:     #ffffff;
      --muted:     #b07840;
      --border:    #f0d0a0;
      --hover-btn: #e09928;
      --surface:   #fff5e8;
      --error:     #DD0303;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 10%, rgba(250,177,47,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 15% 90%, rgba(250,129,47,0.08) 0%, transparent 55%);
      pointer-events: none;
    }

    /* ── Card ── */
    .card {
      position: relative;
      background: var(--white);
      border-radius: 24px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow:
        0 1px 2px rgba(250,129,47,0.06),
        0 4px 16px rgba(250,129,47,0.10),
        0 16px 48px rgba(44,44,44,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Brand ── */
    .brand-icon { margin-bottom: 18px; }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--plum);
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 36px;
      letter-spacing: 0.01em;
    }

    /* ── Form ── */
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field { position: relative; }

    input {
      width: 100%;
      height: 50px;
      padding: 0 48px 0 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--charcoal);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder { color: var(--muted); opacity: 0.8; }

    input:focus {
      border-color: var(--berry);
      box-shadow: 0 0 0 3.5px rgba(250,177,47,0.18);
    }

    input[type="email"] { padding-right: 16px; }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color 0.15s;
      padding: 4px;
    }
    .eye-btn:hover { color: var(--berry); }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      height: 50px;
      background: var(--berry);
      color: var(--white);
      border: none;
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(250,177,47,0.40);
      margin-top: 4px;
    }
    .btn-primary:hover {
      background: var(--hover-btn);
      box-shadow: 0 6px 20px rgba(250,177,47,0.50);
    }
    .btn-primary:active { transform: scale(0.98); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-secondary {
      width: 100%;
      height: 50px;
      background: transparent;
      color: var(--berry);
      border: 2px solid var(--berry);
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-secondary:hover { background: var(--surface); }
    .btn-secondary:active { transform: scale(0.98); }

    /* ── Footer ── */
    .guest-link {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--berry);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.15s;
    }
    .guest-link:hover { color: var(--plum); text-decoration: underline; }
    .guest-link svg { transition: transform 0.15s; }
    .guest-link:hover svg { transform: translateX(3px); }
  </style>
</head>
<body>
<main>
  <section class="card">

    <!-- Icon -->
    <div class="brand-icon">
      <svg width="110" height="110" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="100" fill="#FAB12F"/>
        <g transform="rotate(-45, 100, 100)">
          <path d="M162,97 L60,89 L52,86 L52,116 L60,113 C95,122 138,111 162,97 Z" fill="white"/>
          <path d="M52,91 L15,94 L15,110 L52,113 Z" fill="white"/>
          <circle cx="24" cy="102" r="3" fill="#FA812F"/>
          <circle cx="34" cy="102" r="3" fill="#FA812F"/>
          <circle cx="44" cy="102" r="3" fill="#FA812F"/>
        </g>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="brand-title">TheKnife</h1>
    <p class="brand-sub">Scopri i migliori ristoranti</p>

    <!-- Form -->
    <form onsubmit="return false">
      <div class="field">
        <input type="email" placeholder="Email o username" autocomplete="email"/>
      </div>

      <div class="field">
        <input type="password" placeholder="Password" autocomplete="current-password"/>
        <button class="eye-btn" type="button" aria-label="Mostra password">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="btn-primary" type="submit">Accedi</button>

      <div class="divider">oppure</div>

      <button class="btn-secondary" type="button" onclick="location.href='registrazione.html'">Registrati</button>
    </form>

    <!-- Guest -->
    <a class="guest-link" href="#">
      Continua come ospite
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </a>

  </section>
</main>
</body>
</html>

<!DOCTYPE html>
<!-- Pagina della mappa (Leaflet), caricata dentro il WebView di MappaController. -->
<!-- Solo motore grafico: disegna tile/marker, nessuna logica applicativa, nessun dato,   -->
<!-- nessuna chiamata di rete oltre ai tile della mappa. Ogni interazione (click su un    -->
<!-- marker) viene inoltrata a window.javaBridge, che decide tutto lato Java.             -->
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="leaflet.css">
    <script src="leaflet.js"></script>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        .marker-theknife-punto {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #FAB12F;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(44,44,44,0.4);
            transition: width 0.15s, height 0.15s, margin 0.15s;
        }
        .marker-theknife-evidenziato .marker-theknife-punto {
            width: 24px;
            height: 24px;
            margin: -4px 0 0 -4px;
            background: #FA812F;
            box-shadow: 0 0 0 6px rgba(250,129,47,0.35);
        }

        /* Controlli di Leaflet ristilizzati sul design system dell'app (bordi retti, palette). */
        .leaflet-control-zoom {
            border: none !important;
            box-shadow: none !important;
        }
        .leaflet-control-zoom a {
            background: white !important;
            color: #FA812F !important;
            border: 2px solid #f0d0a0 !important;
            border-radius: 0 !important;
            font-family: Arial, sans-serif;
            font-weight: 700;
        }
        .leaflet-control-zoom a:hover {
            background: #fff5e8 !important;
        }
        .leaflet-control-zoom-in {
            margin-bottom: -2px !important;
        }
        .leaflet-control-attribution {
            background: rgba(255,255,255,0.85) !important;
            border-radius: 0 !important;
            font-family: Arial, sans-serif;
            color: #b07840 !important;
            font-size: 10px;
        }
        .leaflet-control-attribution a {
            color: #b07840 !important;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 0 !important;
            box-shadow: 0 2px 8px rgba(44,44,44,0.25) !important;
        }
        .leaflet-popup-content {
            font-family: Arial, sans-serif;
            color: #2C2C2C;
            font-weight: 700;
            font-size: 13px;
            margin: 10px 12px;
        }
        .leaflet-popup-tip {
            box-shadow: 0 2px 8px rgba(44,44,44,0.25) !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // WebView JavaFX senza accelerazione grafica: animazioni disattivate (zoom/pan a
        // scatto invece che fluidi). clickTolerance alta perché il WebView riporta la
        // posizione del mouse meno precisa di un browser vero (altrimenti ogni click viene
        // letto come micro-trascinamento). doubleClickZoom disattivato: un doppio click per
        // riselezionare un marker altrimenti zooma e sposta tutti i marker sotto.
        var map = L.map('map', {
            zoomControl: true,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false,
            inertia: false,
            clickTolerance: 15,
            doubleClickZoom: false
        }).setView([42.5, 12.5], 5);

        // keepBuffer al default di Leaflet (2, non 6): su schermi Retina il WebView deve
        // già ridisegnare 4x i pixel fisici, tenere tile extra pronti aggrava il costo di
        // disegno invece di ridurre il grigio (S45). updateWhenIdle: aggiorna i tile solo a
        // trascinamento concluso, non continuamente durante il drag.
        var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19,
            keepBuffer: 2,
            updateWhenIdle: true
        }).addTo(map);

        // DEBUG TEMPORANEO (S45) — da togliere una volta capita la causa dei tile grigi.
        // 'tileerror' dice se il tile è stato richiesto ed è fallito (rete/HTTP), 'tileload'
        // se è arrivato bene: la differenza tra i due conteggi dice se il buco è un errore di
        // rete o un tile che Leaflet non ha mai nemmeno provato a richiedere.
        //
        // Bufferizzato: i primi tileload/tileerror possono scattare (tile veloci/da cache)
        // prima che Java abbia iniettato window.javaBridge (succede solo dopo che questo
        // script ha già finito di girare una volta) — senza buffer, quei primi messaggi si
        // perdono in silenzio invece di arrivare in console.
        var tileOk = 0, tileErrore = 0;
        var debugBuffer = [];
        function inviaDebug(messaggio) {
            if (window.javaBridge && window.javaBridge.onDebug) {
                window.javaBridge.onDebug(messaggio);
            } else {
                debugBuffer.push(messaggio);
            }
        }
        function flushDebug() {
            for (var i = 0; i < debugBuffer.length; i++) {
                window.javaBridge.onDebug(debugBuffer[i]);
            }
            debugBuffer = [];
        }
        tileLayer.on('tileload', function () {
            tileOk++;
        });
        tileLayer.on('tileerror', function (e) {
            tileErrore++;
            inviaDebug('tile fallito: ' + e.tile.src);
        });

        // Rete di sicurezza (S45): il WebView non sempre segnala con precisione la fine di
        // un trascinamento/zoom, lasciando buchi di tile mai richiesti. Debounce (clearTimeout):
        // adattaVista() con più marker genera 3 trigger in un colpo solo (fitBounds scatena sia
        // 'moveend' sia 'zoomend', più la chiamata esplicita) — senza debounce, 3 correzioni in
        // corsa che si intralciano a vicenda invece di aiutare.
        //
        // tileLayer._update() (interno, non redraw()): ricalcola i tile che servono per la
        // vista corrente e carica solo quelli mancanti. redraw() pubblico fa anche
        // _removeAllTiles() prima — distrugge e ricrea da zero anche i tile già a posto, più
        // lavoro di disegno sullo stesso motore già lento (Retina) invece di limitarsi a
        // colmare i buchi. _update() è il metodo che redraw() stesso chiama dopo la pulizia:
        // usarlo da solo, senza pulizia, è meno distruttivo. Nome con underscore, non
        // documentato pubblicamente, ma leaflet.js è un asset bundlato a versione fissa
        // (1.1.1), non aggiornato da un CDN: non cambia sotto i piedi.
        // Il debug (S45) ha escluso rete/logica: 0 tile falliti, tutti arrivati secondo
        // Leaflet, eppure il grigio resta — non un tile mancante ma un problema di
        // ripittura in WebKit. Tentato un forzaRepaint() con display:none/'' su <body>: ha
        // rotto l'interazione con la mappa (probabile corruzione della cache dimensioni
        // di Leaflet, figlio dello stesso <body> toccato). Ritirato, non riprovare la stessa
        // via senza un modo di testare a schermo prima di consegnare il codice.

        var timeoutRedraw = null;
        function forzaRicalcoloTile() {
            clearTimeout(timeoutRedraw);
            timeoutRedraw = setTimeout(function () {
                tileLayer._update();
                // DEBUG TEMPORANEO (S45): conteggio al momento più affidabile di map.on('load')
                // (one-shot, rischia di scattare subito su un viewport 1x1 prima del resize).
                inviaDebug('tile ok=' + tileOk + ' errore=' + tileErrore);
            }, 400);
        }
        // 'moveend' copre sia il trascinamento utente sia lo spostamento programmatico
        // (panTo/setView/fitBounds).
        map.getContainer().addEventListener('mouseup', forzaRicalcoloTile);
        map.on('moveend', forzaRicalcoloTile);
        map.on('zoomend', forzaRicalcoloTile);

        var marker = {};
        var markerEvidenziato = null;

        function creaIcona() {
            return L.divIcon({
                className: 'marker-theknife',
                html: '<div class="marker-theknife-punto"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
        }

        function aggiungiMarker(id, lat, lng) {
            var m = L.marker([lat, lng], { icon: creaIcona(), clickTolerance: 15 }).addTo(map);
            m.on('click', function () {
                evidenziaMarker(id);
                if (window.javaBridge) {
                    window.javaBridge.onMarkerClick(id);
                }
            });
            marker[id] = m;
        }

        function pulisciMarker() {
            for (var id in marker) {
                map.removeLayer(marker[id]);
            }
            marker = {};
            markerEvidenziato = null;
        }

        function centraSu(lat, lng, zoom) {
            map.setView([lat, lng], zoom);
        }

        function invalidaDimensione() {
            // invalidateSize() da solo genera 'moveend' (e quindi il redraw) solo a volte,
            // non garantito — soprattutto al primo caricamento, quando il WebView è ancora
            // 1x1 prima del vincolo di larghezza JavaFX. Redraw sempre esplicito.
            map.invalidateSize();
            forzaRicalcoloTile();
        }

        function evidenziaMarker(id) {
            var m = marker[id];
            if (!m) {
                return;
            }
            // animate:false: con l'animazione di panTo attiva, un click su un marker
            // successivo mentre la vista si sta ancora assestando veniva letto dal WebView
            // come trascinamento e scartato da Leaflet — click "morto" dal secondo marker
            // in poi (S47).
            map.panTo(m.getLatLng(), { animate: false });
            if (markerEvidenziato !== null && markerEvidenziato !== id && marker[markerEvidenziato]) {
                var vecchioEl = marker[markerEvidenziato].getElement();
                if (vecchioEl) {
                    vecchioEl.classList.remove('marker-theknife-evidenziato');
                }
            }
            var el = m.getElement();
            if (el) {
                el.classList.add('marker-theknife-evidenziato');
            }
            markerEvidenziato = id;
        }

        function adattaVista() {
            map.invalidateSize();
            var lista = Object.values(marker);
            if (lista.length === 0) {
                return;
            }
            if (lista.length === 1) {
                map.setView(lista[0].getLatLng(), 14);
                forzaRicalcoloTile();
                return;
            }
            var featureGroup = L.featureGroup(lista);
            map.fitBounds(featureGroup.getBounds().pad(0.15), { maxZoom: 15 });
            forzaRicalcoloTile();
        }
    </script>
</body>
</html>

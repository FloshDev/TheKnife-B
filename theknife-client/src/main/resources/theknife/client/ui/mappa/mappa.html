<!DOCTYPE html>
<!-- Pagina della mappa (Leaflet), caricata dentro il WebView di MappaController. -->
<!-- Solo motore grafico: disegna tile/marker, nessuna logica applicativa, nessun dato,   -->
<!-- nessuna chiamata di rete oltre ai tile della mappa. Ogni interazione (click su un    -->
<!-- marker) viene inoltrata a window.javaBridge, che decide tutto lato Java.             -->
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="leaflet.css">
    <script src="leaflet.js"></script>
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        .marker-theknife-punto {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #FAB12F;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(44,44,44,0.4);
            transition: width 0.15s, height 0.15s, margin 0.15s;
        }
        .marker-theknife-evidenziato .marker-theknife-punto {
            width: 24px;
            height: 24px;
            margin: -4px 0 0 -4px;
            background: #FA812F;
            box-shadow: 0 0 0 6px rgba(250,129,47,0.35);
        }

        /* Controlli di Leaflet ristilizzati sul design system dell'app (bordi retti, palette). */
        .leaflet-control-zoom {
            border: none !important;
            box-shadow: none !important;
        }
        .leaflet-control-zoom a {
            background: white !important;
            color: #FA812F !important;
            border: 2px solid #f0d0a0 !important;
            border-radius: 0 !important;
            font-family: Arial, sans-serif;
            font-weight: 700;
        }
        .leaflet-control-zoom a:hover {
            background: #fff5e8 !important;
        }
        .leaflet-control-zoom-in {
            margin-bottom: -2px !important;
        }
        .leaflet-control-attribution {
            background: rgba(255,255,255,0.85) !important;
            border-radius: 0 !important;
            font-family: Arial, sans-serif;
            color: #b07840 !important;
            font-size: 10px;
        }
        .leaflet-control-attribution a {
            color: #b07840 !important;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 0 !important;
            box-shadow: 0 2px 8px rgba(44,44,44,0.25) !important;
        }
        .leaflet-popup-content {
            font-family: Arial, sans-serif;
            color: #2C2C2C;
            font-weight: 700;
            font-size: 13px;
            margin: 10px 12px;
        }
        .leaflet-popup-tip {
            box-shadow: 0 2px 8px rgba(44,44,44,0.25) !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Il WebView di JavaFX non ha l'accelerazione grafica di un browser vero: le
        // animazioni di Leaflet (zoom, pan con inerzia) lo appesantiscono anche con pochi
        // elementi. Disattivate: zoom/pan "a scatto" invece che fluidi, ma reattivi.
        // clickTolerance alta: il WebView di JavaFX riporta la posizione del mouse in
        // modo meno preciso di un browser vero, così Leaflet interpreta quasi ogni click
        // come un micro-trascinamento e non genera l'evento "click" (il doppio click
        // funzionava comunque, perché usa l'evento nativo del browser, non quello di
        // Leaflet, che passa sempre da questo controllo).
        var map = L.map('map', {
            zoomControl: true,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false,
            inertia: false,
            clickTolerance: 15,
            // Cliccare due volte lo stesso marker (per riselezionarlo) veniva interpretato
            // come doppio click nativo, zoom improvviso non richiesto che spostava tutti i
            // marker sotto ai click successivi.
            doubleClickZoom: false
        }).setView([42.5, 12.5], 5);

        var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19,
            // Margine di tile pre-caricati oltre l'area visibile (default Leaflet: 2):
            // più alto = meno grigio quando ti sposti, a costo di più dati scaricati
            // all'inizio per l'area extra.
            keepBuffer: 6,
            // Per default Leaflet riposiziona/ridisegna i tile in continuazione MENTRE
            // trascini, non solo alla fine: su un motore di rendering più lento del
            // WebView questo probabilmente è la fonte del glitch anche su tile già in
            // cache. Aggiorna solo a trascinamento finito, come le animazioni disattivate.
            updateWhenIdle: true
        }).addTo(map);

        // Rete di sicurezza: il WebView a volte non segnala bene la fine di un
        // trascinamento/zoom (stessa imprecisione del mouse già vista coi click) e
        // Leaflet lascia dei tile mai richiesti. redraw() è diretto: butta via tutti i
        // tile del livello e li richiede di nuovo per la vista corrente, indipendentemente
        // da cosa Leaflet pensa sia successo.
        function forzaRicalcoloTile() {
            setTimeout(function () {
                tileLayer.redraw();
            }, 100);
        }
        // 'moveend' copre sia il trascinamento dell'utente sia lo spostamento
        // programmatico (panTo/setView/fitBounds, es. click su un marker/card che centra
        // un ristorante lontano) — un mouseup grezzo sul container copriva solo il primo
        // caso, lasciando buchi di tile dopo un pan da click (S45). La causa del blocco dei
        // click dopo pochi utilizzi (S47) non era questo redraw, ma il bridge Java↔JS
        // raccolto dal garbage collector — risolto altrove, il redraw può restare com'era.
        map.getContainer().addEventListener('mouseup', forzaRicalcoloTile);
        map.on('moveend', forzaRicalcoloTile);
        map.on('zoomend', forzaRicalcoloTile);

        var marker = {};
        var markerEvidenziato = null;

        function creaIcona() {
            return L.divIcon({
                className: 'marker-theknife',
                html: '<div class="marker-theknife-punto"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
        }

        function aggiungiMarker(id, lat, lng) {
            var m = L.marker([lat, lng], { icon: creaIcona(), clickTolerance: 15 }).addTo(map);
            m.on('click', function () {
                evidenziaMarker(id);
                if (window.javaBridge) {
                    window.javaBridge.onMarkerClick(id);
                }
            });
            marker[id] = m;
        }

        function pulisciMarker() {
            for (var id in marker) {
                map.removeLayer(marker[id]);
            }
            marker = {};
            markerEvidenziato = null;
        }

        function centraSu(lat, lng, zoom) {
            map.setView([lat, lng], zoom);
        }

        function invalidaDimensione() {
            // invalidateSize() da solo ridisegna i tile mancanti solo se Leaflet decide
            // internamente di generare 'moveend' (dipende dall'offset di ricentraggio
            // calcolato, non garantito) — soprattutto al primo caricamento, quando il
            // WebView è ancora ridotto a icona (1x1) prima che il vincolo di larghezza
            // JavaFX si applichi. Non ci si affida a quel comportamento: redraw sempre
            // esplicito, come per il resto della rete di sicurezza.
            map.invalidateSize();
            forzaRicalcoloTile();
        }

        function evidenziaMarker(id) {
            var m = marker[id];
            if (!m) {
                return;
            }
            // animate:false come le altre animazioni disattivate in cima al file: panTo di
            // default anima il pan, e se si clicca un marker successivo mentre l'animazione
            // sta ancora assestandosi il WebView (impreciso sul mouse) può interpretare il
            // click come trascinamento — Leaflet lo scarta silenziosamente, click "morto"
            // dal secondo marker in poi (S47).
            map.panTo(m.getLatLng(), { animate: false });
            if (markerEvidenziato !== null && markerEvidenziato !== id && marker[markerEvidenziato]) {
                var vecchioEl = marker[markerEvidenziato].getElement();
                if (vecchioEl) {
                    vecchioEl.classList.remove('marker-theknife-evidenziato');
                }
            }
            var el = m.getElement();
            if (el) {
                el.classList.add('marker-theknife-evidenziato');
            }
            markerEvidenziato = id;
        }

        function adattaVista() {
            map.invalidateSize();
            var lista = Object.values(marker);
            if (lista.length === 0) {
                return;
            }
            if (lista.length === 1) {
                map.setView(lista[0].getLatLng(), 14);
                forzaRicalcoloTile();
                return;
            }
            var featureGroup = L.featureGroup(lista);
            map.fitBounds(featureGroup.getBounds().pad(0.15), { maxZoom: 15 });
            forzaRicalcoloTile();
        }
    </script>
</body>
</html>
